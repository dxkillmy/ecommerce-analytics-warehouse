version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    columns:
      - name: stock_code
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fact_sales
    columns:
      - name: sales_key
        data_tests:
          - unique
          - not_null
      - name: stock_code
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: stock_code
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id